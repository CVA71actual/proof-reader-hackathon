<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Reader</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="mk">P</span><span class="wm">Proof <em>Reader</em></span></div>
    <nav class="nav" id="nav">
      <button class="ni on" data-scr="audit">Audit log<span class="ct" id="ct-audit"></span></button>
      <button class="ni" data-scr="calendar">Catalyst Calendar<span class="ct" id="ct-calendar"></span></button>
      <button class="ni" data-scr="source">Source view<span class="ct" id="ct-source"></span></button>
      <button class="ni" data-scr="trail">Agent trail<span class="ct" id="ct-trail"></span></button>
      <button class="ni" data-scr="judgment" id="ni-judgment">Judgment needed<span class="ct" id="ct-judgment"></span></button>
      <button class="ni" data-soon>What changed<span class="ct later">U7</span></button>
      <button class="ni" data-soon>Export<span class="ct later">U9</span></button>
    </nav>
    <button class="runcard" id="runcard" hidden>
      <div class="t1" id="runcard-title"></div>
      <div class="t2" id="runcard-sub"></div>
      <div class="t3" id="runcard-flag" hidden></div>
    </button>
    <div class="side-ft">
      <button class="tg" id="theme" aria-pressed="false">Light / dark</button>
      <div class="ft" id="side-foot"></div>
    </div>
  </aside>

  <div class="screens" id="screens">
    <section class="screen on" id="scr-audit">
      <div class="pane list">
        <div class="ph">
          <h2>Audit log</h2>
          <div class="sub" id="audit-sub"></div>
          <div class="runlabel" id="audit-runlabel" hidden></div>
          <div class="counters" id="audit-counters"></div>
          <button class="attnbtn" id="attnbtn"></button>
        </div>
        <div class="facets" id="audit-facets"></div>
        <div class="rows" id="audit-rows"></div>
      </div>
      <div class="pane mid" id="audit-mid"></div>
      <div class="pane det" id="audit-det"></div>
    </section>

    <section class="screen" id="scr-source">
      <div class="pane list">
        <div class="ph"><h2>Source view</h2><div class="sub" id="src-sub"></div></div>
        <div class="rows" id="srcList"></div>
      </div>
      <div class="pane mid">
        <button class="backbtn" id="src-back" hidden>← Back to pages</button>
        <button class="backbtn" id="src-back-audit" hidden>← Back to Audit log</button>
        <div class="srcwrap" id="srcwrap"></div>
      </div>
      <div class="pane det" id="srcDet"></div>
    </section>

    <section class="screen" id="scr-judgment">
      <div class="pane list">
        <div class="ph"><h2>Judgment needed</h2><div class="sub" id="judgment-sub"></div></div>
        <div class="rows" id="judgment-rows"></div>
      </div>
      <div class="pane mid" id="judgment-mid"></div>
      <div class="pane det" id="judgment-det"></div>
    </section>

    <section class="screen" id="scr-trail">
      <div class="pane list">
        <div class="ph"><h2>Agent trail</h2><div class="sub" id="trail-sub"></div></div>
        <div class="rows" id="trail-rows"></div>
      </div>
      <div class="pane mid">
        <button class="backbtn" id="trail-back" hidden>← Back to rows</button>
        <div class="trailscroll" id="trail-mid"></div>
      </div>
      <div class="pane det" id="trail-det"></div>
    </section>

    <section class="screen" id="scr-calendar">
      <div class="pane mid" id="cal-mid"></div>
      <div class="pane det" id="cal-det"></div>
    </section>
  </div>
</div>

<div class="sheetwrap" id="runsheet-wrap" hidden>
  <div class="sheet">
    <div class="sh-t">Choose a run</div>
    <div class="sh-s">Every saved run under runs/.</div>
    <div id="runsheet-list"></div>
    <div class="btnrow" style="margin-top:14px"><button class="btn" id="runsheet-close">Close</button></div>
  </div>
</div>

<div class="sheetwrap" id="dialog-wrap" hidden>
  <div class="sheet" id="dialog"></div>
</div>

<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
