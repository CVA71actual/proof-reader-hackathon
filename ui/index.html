<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof Reader</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><span class="mk">P</span><span class="wm">Proof <em>Reader</em></span></div>
    <nav class="nav" id="nav">
      <button class="ni" data-soon>Audit log<span class="ct later">U2</span></button>
      <button class="ni" data-soon>Catalyst Calendar<span class="ct later">U6</span></button>
      <button class="ni on" data-scr="source">Source view</button>
      <button class="ni" data-soon>Agent trail<span class="ct later">U5</span></button>
      <button class="ni" data-soon>Judgment needed<span class="ct later">U4</span></button>
      <button class="ni" data-soon>What changed<span class="ct later">U7</span></button>
      <button class="ni" data-soon>Export<span class="ct later">U9</span></button>
    </nav>
    <div class="runcard" id="runcard" hidden>
      <div class="t1" id="runcard-title">Saved results</div>
      <div class="t2" id="runcard-sub"></div>
      <div class="t3" id="runcard-flag" hidden></div>
    </div>
    <div class="side-ft">
      <button class="tg" id="theme" aria-pressed="false">Light / dark</button>
      <div class="ft" id="side-foot"></div>
    </div>
  </aside>

  <div class="screens">
    <section class="screen on" id="scr-source">
      <div class="pane list" id="src-list-pane">
        <div class="ph">
          <h2>Source view</h2>
          <div class="sub" id="src-sub">The pages the rows rest on</div>
        </div>
        <div class="rows" id="srcList"></div>
      </div>
      <div class="pane mid" id="src-mid-pane">
        <button class="backbtn" id="src-back" hidden>← Back to pages</button>
        <div class="srcwrap" id="srcwrap"></div>
      </div>
      <div class="pane det" id="srcDet">
        <div class="empty" id="det-empty">Click a value to see what was compared.</div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
